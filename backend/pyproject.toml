[project]
name = "iqo-strategy-lab-backend"
version = "0.1.0"
description = "IQO Strategy Lab - backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "loguru>=0.7",
    "httpx>=0.27",
    "iqoptionapi",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv.sources]
# O pacote publicado no PyPI (iqoptionapi==0.5) não expõe stable_api.IQ_Option
# (ver docs/sprints/SPRINT_7_REPORT.md, seção 8). Usamos o fork mantido do
# GitHub, pinado por tag (nunca uma branch móvel), via git+https.
iqoptionapi = { git = "https://github.com/iqoptionapi/iqoptionapi.git", tag = "7.1.1" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
